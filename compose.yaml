services:
  jev:
    build: .
    image: jev-mcphub:local
    restart: unless-stopped
    ports:
      - "${JEV_BIND_IP:-127.0.0.1}:${JEV_PORT:-8080}:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
